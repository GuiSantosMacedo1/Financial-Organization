<section class="appearance mt-3 mb-3 container border border-1 rounded p-3 theme-settings">
  <h3 class="appearance__title">Aparência</h3>
  <p class="appearance__desc" style="color: gray;">
    Escolha entre o tema claro, escuro ou deixe o sistema decidir automaticamente.
  </p>

  <div class="segmented" role="radiogroup" aria-label="Tema">
    @for (option of options; track option.value) {
    <label class="segmented__item">
      <input type="radio" name="theme" [value]="option.value" [checked]="theme.preference() === option.value"
        (change)="theme.setPreference(option.value)" />

      <span class="segmented__label">
        @switch (option.value) {
        @case ('light') {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        }
        @case ('dark') {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        }
        @case ('system') {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="14" x="2" y="3" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
        }
        }
        {{ option.label }}
      </span>
    </label>
    }
  </div>
</section>
