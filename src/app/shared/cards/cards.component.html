<div class="cards row gap-4 gx-0 gy-3 px-5">
  <ng-container *ngIf="!isLoading; else skeletonCards">
    <div *ngFor="let c of configs" class="card-item col border rounded p-3">
      <div class="card-top d-flex justify-content-left align-items-center">
        <div class="card-icon border p-2 rounded" [ngStyle]="{'background-color': backGroundColor(c.type)}">
          <i [ngStyle]="{'color': colorText(c.type)}" [class]="iconByType(c.type)">
          </i>
        </div>
        <div class="ms-4">
          <div class="card-title" style="color:rgb(125, 125, 125);">
            {{ titleByType(c.type) }}
          </div>
          <div class="card-value" style="font-weight: bold;" [ngStyle]="{'color': colorText(c.type)}">
            <ng-container *ngIf="c.type !== 'count'">
              {{ formatCurrency(getValue(c.type)) }}
            </ng-container>
            <ng-container *ngIf="c.type === 'count'">
              {{ getValue('count') }}
            </ng-container>
          </div>
        </div>
      </div>
    </div>

  </ng-container>
  <ng-template #skeletonCards>
    <div *ngFor="let item of [1,2,3]" class="card-item col border rounded p-3">
      <div class="card-top d-flex align-items-center">
        <div class="skeleton skeleton-icon"></div>
        <div class="ms-4 w-100">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-value"></div>
        </div>
      </div>
    </div>
  </ng-template>
</div>
