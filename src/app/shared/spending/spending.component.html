<div class="border rounded p-4 bg-white">
  <div class="mb-3">
    <p class="fw-bold mb-0">Gastos por Categoria</p>
  </div>

<ng-container *ngIf="!isLoading; else skeletonSpending">
  <div *ngFor="let category of categories" class="d-flex justify-content-between align-items-center py-2 border-bottom">
    <div class="d-flex align-items-center gap-3">
      <div class="d-inline-flex align-items-center justify-content-center rounded text-white p-2" [ngClass]="getCategoryColor(category.category)">
        <i class="fas" [ngClass]="getIconsByCategory(category.category)"></i>
      </div>
      <div>
        <div class="fw-semibold">{{ category.category }}</div>
        <div class="progress" style="height:7px; width:80px;">
          <div class="progress-bar" role="progressbar" [style.width]="porcentageOfCategory(category.total)" [ngClass]="getCategoryColor(category.category)" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
      </div>
    </div>

    <div class="text-end">
      <div class="fw-bold">{{ category.total | currency:'BRL':'symbol':'1.2-2' }}</div>
      <div class="text-muted small">{{ porcentageOfCategory(category.total) }}</div>
    </div>
  </div>
</ng-container>

<ng-template #skeletonSpending>
<div *ngFor="let i of [1,2]" class="d-flex justify-content-between align-items-center mb-3">
  <div class="d-flex align-items-center gap-3">
    <div class="skeleton skeleton-icon"></div>
    <div>
      <div class="skeleton skeleton-line title mb-2"></div>
      <div class="skeleton skeleton-line progress"></div>
    </div>
  </div>
  <div class="text-end">
    <div class="skeleton skeleton-line amount mb-2"></div>
    <div class="skeleton skeleton-line percent"></div>
  </div>
</div>
</ng-template>
</div>
