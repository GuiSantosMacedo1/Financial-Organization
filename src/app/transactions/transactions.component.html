<app-side></app-side>
<div class="container-fluid">
  <div class="transactions-content">
    <div class="row">
      <div class="col-md-6">
        <h2>Transações</h2>
        <p style="color: gray;">Gerencie todas as suas transações</p>
      </div>
      <div class="col-md-6 d-flex align-items-center justify-content-end">
        <button class="btn btn-primary btn-sm rounded p-2" (click)="activeModal = true"><i class="fa-solid fa-plus"></i> Nova Transação</button>
      </div>
    </div>
  </div>
  <div class="fil px-5 g-3">
    <div class=" d-flex border rounded" style="gap: 10px; padding: 16px; background-color: white;">
      <input class="" placeholder="Buscar Transação" type="text" style="font-size: 0.9rem;">
      <select class = "" name="form-select" id="formSelect" style="font-size: 0.9rem; color: gray;">
        <option selected>Todos</option>
        <option value="1">Receitas</option>
        <option value="2">Despesas</option>
      </select>
      <select class = "" name="form-select" id="formSelect" style="font-size: 0.9rem; color: gray;">
        <option selected>Todos as Categorias</option>
        <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
      </select>
      <button  class="btn btn-secondary btn-sm" style="width: 60%;">Limpar filtros</button>
    </div>
    </div>
    <div class="cards mt-3">
      <app-cards [configs]="[
        { type: 'income'},
        { type: 'expense'},
        { type: 'count'}
      ]">
      </app-cards>
    </div>
    <div class="transactions px-5 mt-3">
      <app-recent-transactions [activeTodos]="false"></app-recent-transactions>
    </div>
</div>
<app-modal-transactions [isOpen]="activeModal" (close)="activeModal = false"></app-modal-transactions>
