<div class="transactions px-5">
  <div class="row">
    <div class="col border rounded me-3 p-4" style="background-color: white;">
      <div class="d-flex justify-content-between">
        <p style="color: gray;">Transações Recentes</p>
        <button class="btn btn-secondary">Ver Todas</button>
      </div>
      <div *ngFor="let transaction of transactions" class="border rounded mb-3" style="background-color: #fafafa;">
        <div class="transaction-item d-flex justify-content-between align-items-center border-bottom py-3">
          <div class="transaction-info ms-3">
            <div class="transaction-description fw-bold">{{ transaction.description }}</div>
            <div class="transaction-category text-muted small">{{ transaction.category }}</div>
          </div>
          <div class="transaction-details text-end me-3">
              <div class="transaction-amount" [class.text-success]="transaction.amount > 0" [class.text-danger]="transaction.amount < 0">
                {{ transaction.amount | currency:'BRL':'symbol':'1.2-2' }}
          </div>
            <div class="transaction-date text-muted small">{{ transaction.date | date:'dd/MM/yyyy' }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-4 border rounded p-4 d-flex justify-content-end" style="background-color: white;">

    </div> 
  </div>
</div>
