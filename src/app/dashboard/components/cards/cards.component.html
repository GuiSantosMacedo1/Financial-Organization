<div class="cards-container px-5">
  <div class="row">
    <div class="col border rounded me-3 p-3" style="background-color: rgb(255, 255, 255);">
      <div class="d-flex justify-content-left align-items-center">
        <div class="icon border p-2 rounded" style="color: green; background-color: rgb(175, 249, 175);">
          <i class="fa-solid fa-arrow-up"></i>
        </div>
        <div class="receitas ms-4" style="color: rgb(125, 125, 125);">
          Receitas
          <div class="value" style="color: green; font-weight: bold;">{{ calculateTotalIncome() | currency:'BRL':'symbol':'1.2-2' }}</div>
        </div>
      </div>
    </div>
    <div class="col border rounded me-3 p-3" style="background-color: rgb(255, 255, 255);">
      <div class="d-flex justify-content-left align-items-center">
        <div class="icon border p-2 rounded" style="color: red; background-color: rgb(251, 201, 201);">
          <i class="fa-solid fa-arrow-down"></i>
        </div>
        <div class="despesas ms-4" style="color: rgb(125, 125, 125);">
          Despesas
          <div class="value" style="color: red; font-weight: bold;">{{ calculateTotalExpense() | currency:'BRL':'symbol':'1.2-2' }}</div>
        </div>
      </div>
    </div>
    <div class="col border rounded me-3 p-3" style="background-color: rgb(255, 255, 255);">
      <div class="d-flex justify-content-left align-items-center">
        <div class="icon border p-2 rounded" style="color: blue; background-color: rgb(180, 236, 255);">
          <i class="fa-solid fa-balance-scale"></i>
        </div>
      <div class="saldo ms-4" style="color: rgb(125, 125, 125);">
        Saldo
        <div class="value" style="color: blue; font-weight: bold;">{{ calculateBalance() | currency:'BRL':'symbol':'1.2-2' }}</div>
      </div>
    </div>
    </div>
  </div>
</div>
