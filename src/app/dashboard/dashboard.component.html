<div class="geral">
  <div class="dashboard-container">
    <div class="row">
      <div class="col-4">
          <a class="board" href="#"><i class="fa-solid fa-wallet"></i>Finance Control</a>
      </div>
      <div class="col-8">
        <div class="dashboard-sidebar">
          <ul role="navigation">
            <li *ngFor="let item of menuItems">
              <a (click)="setActiveTab(item.tab)" [class.active]="isActiveTab(item.tab)" [routerLink]="item.route">{{ item.name }}</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="dashboard-content">
    <div class="row">
      <div class="col-md-6">
        <h2>Dashboard Financeiro</h2>
        <p style="color: gray;">Visão geral das finanças</p>
      </div>
      <div class="col-md-6 d-flex align-items-center justify-content-end">
        <button class="btn btn-primary btn-sm rounded p-2" (click)="activeModal = true"><i class="fa-solid fa-plus"></i> Nova Transação</button>
      </div>
    </div>
  </div>
  <div class="cards-container">
    <app-cards></app-cards>
  </div>
  <div class="transactions-container mt-4">
    <app-transactions></app-transactions>
  </div>
</div>

<app-modal-transactions [isOpen]="activeModal" (close)="activeModal = false"></app-modal-transactions>
